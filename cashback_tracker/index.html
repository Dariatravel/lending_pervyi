<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Кешбек по категориям</title>
    <link href="https://storage.yandexcloud.net/abhazbereg-media/media/branding/favicon-48.png" rel="icon" type="image/png"/>
    <link href="https://storage.yandexcloud.net/abhazbereg-media/media/branding/apple-touch-icon.png" rel="apple-touch-icon"/>
    <link rel="stylesheet" href="./styles.min.css?v=202607091715" />
<link rel="preconnect" href="https://storage.yandexcloud.net" crossorigin />
  </head>
  <body>
    <main class="app-shell">
      <section class="app-header">
        <p class="section-label">Кешбек</p>
        <h1>Категории этого месяца</h1>
        <p id="monthStatus" class="month-status"></p>
      </section>

      <section class="overview-grid">
        <div class="controls-card">
          <label class="field">
            <span>Поиск по категории, банку или бренду</span>
            <input
              id="categorySearchInput"
              type="search"
              inputmode="search"
              autocomplete="off"
              placeholder="Например: аптеки, такси, одежда, Пятёрочка"
            />
            <div id="categorySearchSuggestions" class="search-suggestions" hidden></div>
          </label>
          <p id="categorySearchStatus" class="search-status"></p>
        </div>

        <div class="bank-overview-card">
          <h2>Банки и их категории</h2>
          <p id="bankOverviewStatus" class="bank-overview-status"></p>
          <div id="bankOverviewList" class="bank-overview-list"></div>
        </div>
      </section>

      <section>
        <div id="categoryDirectory" class="category-directory"></div>
      </section>
    </main>

    <template id="emptyStateTemplate">
      <div class="empty-state">
        <h2>Нет данных</h2>
        <p>За выбранный месяц пока не добавлены категории кешбека.</p>
      </div>
    </template>

    <script src="./app.js" defer></script>
</body>
</html>
