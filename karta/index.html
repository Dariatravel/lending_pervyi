<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Карта объектов — Абхазберег</title>
  <meta name="description" content="Интерактивная карта проверенных объектов размещения Абхазберег по курортам Абхазии." />
  <meta name="robots" content="noindex, follow" />
  <link rel="manifest" href="/app.webmanifest" />
  <meta name="theme-color" content="#d9eee7" />
  <link href="https://storage.yandexcloud.net/abhazbereg-media/media/branding/favicon-48.png" rel="icon" type="image/png"/>
  <link href="https://storage.yandexcloud.net/abhazbereg-media/media/branding/apple-touch-icon.png" rel="apple-touch-icon"/>
<link rel="stylesheet" href="../styles.min.css?v=202607300900" />
<link rel="preconnect" href="https://storage.yandexcloud.net" crossorigin />
<link rel="preconnect" href="https://a.tile.openstreetmap.org" crossorigin />
<link rel="preconnect" href="https://b.tile.openstreetmap.org" crossorigin />
<link rel="preconnect" href="https://c.tile.openstreetmap.org" crossorigin />
</head>
<body class="objects-map-page">
  <header class="objects-map-page__bar">
    <a class="objects-map-page__back" href="/">← К каталогу</a>
    <p class="objects-map-page__title">Карта объектов <strong>Абхазберег</strong></p>
    <p class="objects-map-page__city" id="objects-map-city">Абхазия</p>
  </header>
  <div id="objects-map" role="region" aria-label="Интерактивная карта объектов"></div>
  <p class="objects-map-page__status" hidden id="objects-map-status"></p>

  <script defer src="../pwa.js?v=202607300900"></script>
  <script>
    (function () {
      var LEAFLET_CSS_URL = "../vendor/leaflet/leaflet.css?v=202607300900";
      var LEAFLET_JS_URL = "../vendor/leaflet/leaflet.js?v=202607300900";
      var LEAFLET_CLUSTER_CSS_URL = "../vendor/leaflet-markercluster/MarkerCluster.css?v=202607300900";
      var LEAFLET_CLUSTER_DEFAULT_CSS_URL = "../vendor/leaflet-markercluster/MarkerCluster.Default.css?v=202607300900";
      var LEAFLET_CLUSTER_JS_URL = "../vendor/leaflet-markercluster/leaflet.markercluster.js?v=202607300900";
      var leafletLoadPromise = null;

      var CITIES = {
        ldzaa: { label: "Лдзаа", lon: 40.32, lat: 43.05, z: 13 },
        pitsunda: { label: "Пицунда", lon: 40.34, lat: 43.16, z: 13 },
        gagra: { label: "Гагра", lon: 40.265, lat: 43.278, z: 13 },
        alakhadzy: { label: "Алахадзы", lon: 40.28, lat: 43.22, z: 14 },
        gudauta: { label: "Гудаута", lon: 40.62, lat: 43.1, z: 13 },
        "new-afon": { label: "Новый Афон", lon: 40.82, lat: 43.09, z: 13 },
        sukhum: { label: "Сухум", lon: 41.02, lat: 43.0, z: 12 },
        tsandripsh: { label: "Цандрипш", lon: 40.34, lat: 43.38, z: 13 },
      };
      var DEFAULT_GEO = { label: "Абхазия", lon: 40.5, lat: 43.15, z: 10 };
      var cityKey = new URLSearchParams(window.location.search).get("city") || "";
      var geo = CITIES[cityKey] || DEFAULT_GEO;
      var cityNode = document.getElementById("objects-map-city");
      var statusNode = document.getElementById("objects-map-status");
      var mapHost = document.getElementById("objects-map");

      if (cityNode) cityNode.textContent = geo.label;
      document.title = "Карта объектов — " + geo.label + " | Абхазберег";

      function decodeHtmlText(value) {
        var node = document.createElement("textarea");
        node.innerHTML = String(value || "");
        return node.value;
      }

      function createPopupContent(point, options) {
        var shouldShowTitle = !options || options.showTitle !== false;
        var title = decodeHtmlText(point.title);
        var address = decodeHtmlText(point.address || "");
        var url = String(point.url || "/");
        var wrap = document.createElement("div");
        wrap.className = "objects-map-popup";

        if (shouldShowTitle) {
          var titleNode = document.createElement("p");
          titleNode.className = "objects-map-popup__title";
          titleNode.textContent = title;
          wrap.appendChild(titleNode);
        }

        if (address) {
          var addressNode = document.createElement("p");
          addressNode.className = "objects-map-popup__address";
          addressNode.textContent = address;
          wrap.appendChild(addressNode);
        }

        var link = document.createElement("a");
        link.className = "objects-map-popup__link";
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Открыть объект на сайте";
        wrap.appendChild(link);

        return wrap;
      }

      function createMarkerTitle(point) {
        return decodeHtmlText(point.title)
          .replace(/[<>]/g, "")
          .replace(/\s+/g, " ")
          .trim();
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function filterPoints(points) {
        if (!cityKey) return points;
        return points.filter(function (point) {
          return point.cityKey === cityKey;
        });
      }

      function showStatus(text) {
        if (!statusNode) return;
        statusNode.textContent = text;
        statusNode.hidden = !text;
      }

      function ensureLeafletAssets() {
        if (window.L && window.L.markerClusterGroup) return Promise.resolve();
        if (leafletLoadPromise) return leafletLoadPromise;

        function loadStyle(url, flag) {
          if (document.querySelector('link[data-map-asset="' + flag + '"]')) return;
          var css = document.createElement("link");
          css.rel = "stylesheet";
          css.href = url;
          css.dataset.mapAsset = flag;
          document.head.appendChild(css);
        }

        function loadScript(url, ready) {
          return new Promise(function (resolve, reject) {
            if (ready()) {
              resolve();
              return;
            }
            var script = document.createElement("script");
            script.src = url;
            script.async = true;
            script.onload = function () {
              if (ready()) resolve();
              else reject(new Error("map-asset-unavailable"));
            };
            script.onerror = reject;
            document.head.appendChild(script);
          });
        }

        loadStyle(LEAFLET_CSS_URL, "leaflet-css");
        loadStyle(LEAFLET_CLUSTER_CSS_URL, "leaflet-cluster-css");
        loadStyle(LEAFLET_CLUSTER_DEFAULT_CSS_URL, "leaflet-cluster-default-css");

        leafletLoadPromise = loadScript(LEAFLET_JS_URL, function () {
          return Boolean(window.L);
        }).then(function () {
          return loadScript(LEAFLET_CLUSTER_JS_URL, function () {
            return Boolean(window.L && window.L.markerClusterGroup);
          });
        });

        return leafletLoadPromise;
      }

      function scheduleMapResize(map) {
        if (!map) return;
        window.requestAnimationFrame(function () {
          if (map.invalidateSize) {
            map.invalidateSize(true);
          } else if (map.container && map.container.fitToViewport) {
            map.container.fitToViewport();
          }
        });
      }

      function bindMapResize(map, group, hasCityFilter) {
        if (!map) return;
        function refit() {
          scheduleMapResize(map);
          if (group && group.getLayers().length) {
            fitMapToPoints(map, group, hasCityFilter);
          }
        }
        refit();
        window.setTimeout(refit, 120);
        window.setTimeout(refit, 420);
        window.addEventListener("resize", refit);
        window.addEventListener("orientationchange", function () {
          window.setTimeout(refit, 280);
        });
      }

      function fitMapToPoints(map, group, hasCityFilter) {
        if (!map || !group || !group.getLayers().length) return;
        var bounds = group.getBounds().pad(hasCityFilter ? 0.18 : 0.06);
        map.fitBounds(bounds, { animate: false, padding: [12, 12] });
      }

      function initLeafletMap(points) {
        if (!mapHost || !window.L) return;
        var map = window.L.map(mapHost, {
          zoomControl: true,
          attributionControl: true,
          fadeAnimation: false,
        }).setView([geo.lat, geo.lon], geo.z);
        window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          updateWhenIdle: true,
          keepBuffer: 4,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        }).addTo(map);

        var group = window.L.markerClusterGroup({
          chunkedLoading: true,
          showCoverageOnHover: false,
          maxClusterRadius: cityKey ? 40 : 56,
        });
        points.forEach(function (point) {
          if (!Number.isFinite(point.lat) || !Number.isFinite(point.lon)) return;
          var marker = window.L.marker([point.lat, point.lon], {
            icon: window.L.divIcon({
              className: "objects-map-leaflet-label",
              html:
                '<span class="objects-map-marker">' +
                '<span class="objects-map-marker__dot" aria-hidden="true"></span>' +
                '<span class="objects-map-marker__label">' +
                escapeHtml(createMarkerTitle(point)) +
                "</span>" +
                "</span>",
              iconSize: null,
              iconAnchor: [6, 0],
              popupAnchor: [0, -10],
            }),
          });
          marker.bindPopup(createPopupContent(point), { maxWidth: 280, className: "objects-map-popup-shell" });
          marker.addTo(group);
        });
        group.addTo(map);
        if (group.getLayers().length) {
          fitMapToPoints(map, group, Boolean(cityKey));
        } else {
          showStatus("Для выбранного города пока нет точек с привязкой к страницам сайта.");
        }
        map.whenReady(function () {
          bindMapResize(map, group, Boolean(cityKey));
        });
      }

      function initLeafletPrimary(points) {
        ensureLeafletAssets()
          .then(function () {
            initLeafletMap(points);
          })
          .catch(function () {
            showStatus("Не удалось загрузить карту. Попробуйте обновить страницу.");
          });
      }

      fetch("../data/objects-map-points.json?v=202607300900")
        .then(function (response) {
          if (!response.ok) throw new Error("map-data");
          return response.json();
        })
        .then(function (payload) {
          var points = filterPoints(Array.isArray(payload.points) ? payload.points : []);
          if (!points.length) {
            showStatus("На карте пока нет объектов для выбранного фильтра.");
          }
          initLeafletPrimary(points);
        })
        .catch(function () {
          showStatus("Не удалось загрузить точки карты. Попробуйте обновить страницу.");
        });
    })();
  </script>
</body>
</html>
