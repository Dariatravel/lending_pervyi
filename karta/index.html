<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Карта объектов — Абхазберег</title>
  <meta name="description" content="Интерактивная карта проверенных объектов размещения Абхазберег по курортам Абхазии." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" href="https://storage.yandexcloud.net/abhazbereg-media/media/branding/favicon-abhazbereg.png" />
  <link rel="stylesheet" href="../styles.css?v=202606120915" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script>
    window.__ABHAZBEREG_MAPS_CONFIG__ = window.__ABHAZBEREG_MAPS_CONFIG__ || {};
  </script>
</head>
<body class="objects-map-page">
  <header class="objects-map-page__bar">
    <a class="objects-map-page__back" href="/">← К каталогу</a>
    <p class="objects-map-page__title">Карта объектов <strong>Абхазберег</strong></p>
    <p class="objects-map-page__city" id="objects-map-city">Абхазия</p>
  </header>
  <div id="objects-map" role="region" aria-label="Интерактивная карта объектов"></div>
  <p class="objects-map-page__status" hidden id="objects-map-status"></p>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    (function () {
      var CITIES = {
        ldzaa: { label: "Лдзаа", lon: 40.32, lat: 43.05, z: 13 },
        pitsunda: { label: "Пицунда", lon: 40.34, lat: 43.16, z: 13 },
        gagra: { label: "Гагра", lon: 40.265, lat: 43.278, z: 13 },
        alakhadzy: { label: "Алахадзы", lon: 40.28, lat: 43.22, z: 14 },
        gudauta: { label: "Гудаута", lon: 40.62, lat: 43.1, z: 13 },
        "new-afon": { label: "Новый Афон", lon: 40.82, lat: 43.09, z: 13 },
        sukhum: { label: "Сухум", lon: 41.02, lat: 43.0, z: 12 },
        tsandripsh: { label: "Цандрипш", lon: 40.34, lat: 43.38, z: 13 },
      };
      var DEFAULT_GEO = { label: "Абхазия", lon: 40.5, lat: 43.15, z: 10 };
      var mapsConfig = window.__ABHAZBEREG_MAPS_CONFIG__ || {};
      var cityKey = new URLSearchParams(window.location.search).get("city") || "";
      var geo = CITIES[cityKey] || DEFAULT_GEO;
      var cityNode = document.getElementById("objects-map-city");
      var statusNode = document.getElementById("objects-map-status");
      var mapHost = document.getElementById("objects-map");

      if (cityNode) cityNode.textContent = geo.label;
      document.title = "Карта объектов — " + geo.label + " | Абхазберег";

      function decodeHtmlText(value) {
        var node = document.createElement("textarea");
        node.innerHTML = String(value || "");
        return node.value;
      }

      function createPopupContent(point) {
        var title = decodeHtmlText(point.title);
        var address = decodeHtmlText(point.address || "");
        var url = String(point.url || "/");
        var wrap = document.createElement("div");
        wrap.className = "objects-map-popup";

        var titleNode = document.createElement("p");
        titleNode.className = "objects-map-popup__title";
        titleNode.textContent = title;
        wrap.appendChild(titleNode);

        if (address) {
          var addressNode = document.createElement("p");
          addressNode.className = "objects-map-popup__address";
          addressNode.textContent = address;
          wrap.appendChild(addressNode);
        }

        var link = document.createElement("a");
        link.className = "objects-map-popup__link";
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Открыть объект на сайте";
        wrap.appendChild(link);

        return wrap;
      }

      function filterPoints(points) {
        if (!cityKey) return points;
        return points.filter(function (point) {
          return !point.cityKey || point.cityKey === cityKey;
        });
      }

      function showStatus(text) {
        if (!statusNode) return;
        statusNode.textContent = text;
        statusNode.hidden = !text;
      }

      function initLeafletMap(points) {
        if (!mapHost || !window.L) return;
        var map = window.L.map(mapHost, { zoomControl: true }).setView([geo.lat, geo.lon], geo.z);
        window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        }).addTo(map);

        var group = window.L.featureGroup();
        points.forEach(function (point) {
          if (!Number.isFinite(point.lat) || !Number.isFinite(point.lon)) return;
          var marker = window.L.circleMarker([point.lat, point.lon], {
            radius: 5,
            color: "#2f6654",
            weight: 2,
            fillColor: "#58a789",
            fillOpacity: 0.92,
          });
          marker.bindPopup(createPopupContent(point), { maxWidth: 280, className: "objects-map-popup-shell" });
          marker.addTo(group);
        });
        group.addTo(map);
        if (group.getLayers().length) {
          map.fitBounds(group.getBounds().pad(cityKey ? 0.18 : 0.1), { maxZoom: cityKey ? 15 : 10 });
        } else {
          showStatus("Для выбранного города пока нет точек с привязкой к страницам сайта.");
        }
      }

      function initYandexMap(points, apiKey) {
        if (!mapHost) return;
        var script = document.createElement("script");
        script.src = "https://api-maps.yandex.ru/2.1/?lang=ru_RU&load=package.full";
        if (apiKey) {
          script.src += "&apikey=" + encodeURIComponent(apiKey);
        }
        script.onload = function () {
          window.ymaps.ready(function () {
            var map = new window.ymaps.Map(mapHost, {
              center: [geo.lat, geo.lon],
              zoom: geo.z,
              controls: ["zoomControl", "typeSelector", "fullscreenControl"],
            });
            var dotLayout = window.ymaps.templateLayoutFactory.createClass(
              '<span class="objects-map-yandex-dot" aria-hidden="true"></span>'
            );
            var geoObjects = points
              .filter(function (point) {
                return Number.isFinite(point.lat) && Number.isFinite(point.lon);
              })
              .map(function (point) {
                var popup = createPopupContent(point);
                return new window.ymaps.Placemark(
                  [point.lat, point.lon],
                  {
                    balloonContentHeader: decodeHtmlText(point.title),
                    balloonContentBody: popup.outerHTML,
                    hintContent: decodeHtmlText(point.title),
                  },
                  {
                    iconLayout: dotLayout,
                    iconOffset: [-3, -11],
                    iconShape: { type: "Circle", coordinates: [4, -4], radius: 7 },
                  }
                );
              });
            geoObjects.forEach(function (geoObject) {
              map.geoObjects.add(geoObject);
            });
            if (geoObjects.length) {
              map.setBounds(map.geoObjects.getBounds(), {
                checkZoomRange: true,
                zoomMargin: cityKey ? 40 : 24,
                preciseZoom: true,
              });
              if (!cityKey && map.getZoom() > 10) {
                map.setZoom(10, { checkZoomRange: true });
              }
            }
            if (!geoObjects.length) {
              showStatus("Для выбранного города пока нет точек с привязкой к страницам сайта.");
            }
          });
        };
        script.onerror = function () {
          initLeafletMap(points);
        };
        document.head.appendChild(script);
      }

      fetch("../data/objects-map-points.json?v=202606120910", { cache: "no-cache" })
        .then(function (response) {
          if (!response.ok) throw new Error("map-data");
          return response.json();
        })
        .then(function (payload) {
          var points = filterPoints(Array.isArray(payload.points) ? payload.points : []);
          if (!points.length) {
            showStatus("На карте пока нет объектов для выбранного фильтра.");
          }
          if (window.location.protocol === "file:") {
            initLeafletMap(points);
          } else {
            initYandexMap(points, mapsConfig.apiKey);
          }
        })
        .catch(function () {
          showStatus("Не удалось загрузить точки карты. Попробуйте обновить страницу.");
        });
    })();
  </script>
</body>
</html>
