# Ручная проверка «Дополнительных обзоров» на скриншоты переписок.
# История: 07.09.2026 в блок «АМОР домики» попал скриншот чужого отзыва
# с безобидной подписью. Скрипт меряет долю белого фона у каждого фото —
# скриншоты мессенджеров выдают себя почти белым полотном.
#
# Находки НЕ роняют прогон: список подозрительных фото печатается в лог,
# смотреть его глазами. Красным прогон становится только при настоящей
# поломке (медиа массово не скачивается, манифест пуст).

name: Supplemental audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Проверить фото дополнительных обзоров
        run: |
          pip install --quiet pillow
          python3 tools/audit_supplemental_screenshots.py
