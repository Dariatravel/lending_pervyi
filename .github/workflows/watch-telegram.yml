name: Watch Telegram

# Telethon (MTProto) фильтруется на RU-хостингах (Timeweb), поэтому проверка
# каналов и автосинк выполняются на раннерах GitHub (вне РФ).
#
# Секреты (Settings → Secrets and variables → Actions):
#   TG_STRING_SESSION            — обязательный; tools/make_tg_string_session.py
#   YANDEX_S3_ACCESS_KEY_ID      — для автосинка (медиа в бакет)
#   YANDEX_S3_SECRET_ACCESS_KEY  — для автосинка
#   TG_BOT_TOKEN / TG_REPORT_CHAT_ID — уведомления в Telegram (необязательно)
#   TELEGRAM_API_ID / TELEGRAM_API_HASH — необязательно (в коде есть значения)
# Логика: нет TG_STRING_SESSION → зелёный пропуск; есть изменения, но нет
# ключей Yandex → только уведомление; есть всё → синк + commit + push.

on:
  workflow_dispatch:
    inputs:
      force_hotel_ids:
        description: "Принудительный синк: id постов отелей через запятую"
        required: false
        default: ""
      force_kv_topics:
        description: "Принудительный синк: topic id квартир через запятую"
        required: false
        default: ""
  schedule:
    - cron: "41 * * * *"

concurrency:
  group: watch-telegram
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    permissions:
      contents: write
    env:
      TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
    steps:
      - name: Проверить наличие сессии
        id: gate
        run: |
          if [ -z "$TG_STRING_SESSION" ]; then
            echo "TG_STRING_SESSION не задан — пропускаю (см. deploy/TELEGRAM_CONNECTIVITY.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.11"

      - name: Установить зависимости
        if: steps.gate.outputs.enabled == 'true'
        run: |
          pip install --quiet -r requirements-site-update-bot.txt
          sudo apt-get -yq install ffmpeg >/dev/null 2>&1 || true

      # Пустая env-переменная ломает int(TELEGRAM_API_ID) в скрипте — экспортируем
      # необязательные значения только если секреты реально заданы.
      - name: Экспортировать необязательные секреты
        if: steps.gate.outputs.enabled == 'true'
        env:
          OPT_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          OPT_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          YC_KEY: ${{ secrets.YANDEX_S3_ACCESS_KEY_ID }}
          YC_SECRET: ${{ secrets.YANDEX_S3_SECRET_ACCESS_KEY }}
          GOOGLE_SA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$OPT_API_ID" ]; then echo "TELEGRAM_API_ID=$OPT_API_ID" >> "$GITHUB_ENV"; fi
          if [ -n "$OPT_API_HASH" ]; then echo "TELEGRAM_API_HASH=$OPT_API_HASH" >> "$GITHUB_ENV"; fi
          if [ -n "$YC_KEY" ] && [ -n "$YC_SECRET" ]; then
            echo "YANDEX_S3_ACCESS_KEY_ID=$YC_KEY" >> "$GITHUB_ENV"
            echo "YANDEX_S3_SECRET_ACCESS_KEY=$YC_SECRET" >> "$GITHUB_ENV"
            echo "SYNC_ENABLED=true" >> "$GITHUB_ENV"
            echo "Ключи Yandex Storage заданы — автосинк включён."
          else
            echo "SYNC_ENABLED=false" >> "$GITHUB_ENV"
            echo "Ключи Yandex Storage не заданы — только наблюдение."
          fi
          # Google service account для фильтров из таблицы «СОЦСЕТИ».
          # Файл в .gitignore — git add -A его не закоммитит. Без секрета
          # шаг фильтров в пайплайне мягко пропускается (warn), синк продолжается.
          if [ -n "$GOOGLE_SA" ]; then
            printf '%s' "$GOOGLE_SA" > google-service-account.json
            echo "Google service account записан — фильтры применяются из таблицы."
          else
            echo "GOOGLE_SERVICE_ACCOUNT_JSON не задан — фильтры из таблицы пропускаются."
          fi

      - name: Восстановить watch-state
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: output/telegram-watch-state.json
          key: telegram-watch-state-${{ github.run_id }}
          restore-keys: |
            telegram-watch-state-

      - name: Проверить каналы (watch-telegram)
        if: steps.gate.outputs.enabled == 'true'
        run: python scripts/watch_telegram_updates.py --strict

      # Точки карты живут в Яндекс-конструкторе (Дарья ставит их руками),
      # синк конструктор → data/objects-map-points.json секретов не требует.
      # При телеграм-изменениях карта уедет общим коммитом «Опубликовать
      # изменения» (git add -A); без них — отдельным шагом ниже.
      - name: Обновить точки карты из Яндекс-конструктора
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          python scripts/sync_objects_map_points.py --apply
          COUNT=$(python -c "import json;print(len(json.load(open('data/objects-map-points.json'))['points']))" 2>/dev/null || echo 0)
          echo "Точек карты после синка: $COUNT"
          if [ "$COUNT" -lt 150 ]; then
            echo "::warning::Подозрительно мало точек ($COUNT) — конструктор мог отдать мусор, откатываю карту."
            git checkout -- data/objects-map-points.json
          fi

      # Столбец «Сайт» таблицы «БАЗА» (вкладка СОЦСЕТИ): новым объектам
      # автоматически подставляется ссылка abhazbereg.ru/<путь страницы>.
      # Скрытые/красные строки и строки без однозначного совпадения не трогаются.
      - name: Автоссылки сайта в таблице БАЗА
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          if [ -f google-service-account.json ]; then
            python tools/update_sheet_site_links.py
          else
            echo "Google-ключа нет — автоссылки в таблице пропущены."
          fi

      - name: Определить, есть ли изменения
        id: detect
        if: steps.gate.outputs.enabled == 'true'
        run: |
          COUNT=$(python -c "import json;d=json.load(open('output/telegram-watch-changed-targets.json'));print(int(d.get('changed_total') or 0)+int(d.get('new_objects_total') or 0))" 2>/dev/null || echo 0)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          FORCE="${{ inputs.force_hotel_ids }}${{ inputs.force_kv_topics }}"
          if [ "$COUNT" != "0" ] || [ -n "$FORCE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Целей из watch: $COUNT; принудительных: '${FORCE}'."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Изменений нет."
          fi

      - name: Синк сайта из Telegram
        id: sync
        if: steps.gate.outputs.enabled == 'true' && steps.detect.outputs.changed == 'true' && env.SYNC_ENABLED == 'true'
        run: |
          # Точечный синк по спискам из watch-отчёта; полный проход (--mode full,
          # ~2.5 часа: медиа скачиваются заново на чистом раннере) — только если
          # точечные цели собрать не удалось.
          TARGET_ARGS=$(EXTRA_HOTEL_IDS="${{ inputs.force_hotel_ids }}" EXTRA_KV_TOPICS="${{ inputs.force_kv_topics }}" python tools/watch_targets_args.py)
          echo "Аргументы синка: ${TARGET_ARGS:---mode full}"
          # --skip-filters убран: при наличии Google-ключа (секрет
          # GOOGLE_SERVICE_ACCOUNT_JSON) пайплайн применяет фильтры из таблицы
          # «СОЦСЕТИ» ко всем объектам; без ключа шаг мягко пропускается.
          python scripts/run_auto_sync_pipeline.py ${TARGET_ARGS:---mode full} --snapshot-only --skip-review-banks --skip-page-health
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Перенести медиа с подписями из комментариев
        if: steps.sync.outputs.done == 'true'
        env:
          EXTRA_HOTEL_IDS: ${{ inputs.force_hotel_ids }}
          EXTRA_KV_TOPICS: ${{ inputs.force_kv_topics }}
        run: python scripts/apply_telegram_supplemental_comments.py --from-watch-targets --force

      - name: Контрольные аудиты после синка
        if: steps.sync.outputs.done == 'true'
        run: |
          python tools/audit_supabase_prod_deps.py
          python tools/validate_catalog_snapshot.py
          python tools/verify_object_media.py

      # Изменения применены и проверены — фиксируем их сигнатуры в watch-state,
      # чтобы тот же самый дифф не попадал в отчёт и синк повторно каждый час.
      - name: Принять применённые изменения в watch-state
        if: steps.sync.outputs.done == 'true'
        run: python tools/accept_watch_changes.py

      - name: Опубликовать изменения
        id: publish
        if: steps.sync.outputs.done == 'true'
        run: |
          git config user.name "abhazbereg-autosync"
          git config user.email "darya.tiande@gmail.com"
          git add -A
          # Игнорируем строки generated_at: если, кроме меток времени, ничего не
          # изменилось — не коммитим (иначе каждый час пустой коммит и деплой).
          if git diff --cached --quiet -I '"generated_at"'; then
            echo "Содержательных изменений нет (только метки времени) — публиковать нечего."
            git reset -q
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(git diff --cached --name-only | wc -l)
          git commit -m "Авто-синк каталога из Telegram (GitHub Actions)"
          # Параллельный run (GitHub иногда не выдерживает concurrency-группу)
          # мог запушить свой авто-синк: ребейзимся с повторами. Конфликты в
          # сгенерированных файлах решаем в пользу НАШЕГО коммита (--theirs при
          # rebase) — расхождение доснимет следующий часовой запуск по watch.
          PUSH_OK=false
          for attempt in 1 2 3 4; do
            if ! git pull --rebase origin main; then
              CONFLICTS=$(git diff --name-only --diff-filter=U)
              if [ -n "$CONFLICTS" ]; then
                echo "$CONFLICTS" | xargs git checkout --theirs --
                echo "$CONFLICTS" | xargs git add --
              fi
              GIT_EDITOR=true git rebase --continue || { git rebase --abort || true; sleep 10; continue; }
            fi
            if git push origin main; then
              PUSH_OK=true
              break
            fi
            sleep 10
          done
          if [ "$PUSH_OK" != "true" ]; then
            echo "::error::Не удалось опубликовать изменения после 4 попыток (см. лог)."
            exit 1
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      # IndexNow: сообщить Яндексу об изменённых страницах — индексация за
      # минуты вместо дней. Ошибка сети не валит синк (скрипт всегда exit 0).
      - name: Отправить изменённые страницы в IndexNow
        if: steps.gate.outputs.enabled == 'true' && steps.publish.outputs.pushed == 'true'
        run: python3 tools/submit_indexnow.py HEAD~1..HEAD || true

      # Карта могла измениться и без изменений в Telegram — тогда общий
      # publish не выполнялся и точки публикуем отдельным коммитом.
      - name: Опубликовать обновление карты
        if: steps.gate.outputs.enabled == 'true' && steps.sync.outputs.done != 'true'
        run: |
          if git diff --quiet -I '"generated_at"' -- data/objects-map-points.json; then
            echo "Точки карты не изменились (или только метка времени) — публиковать нечего."
            git checkout -q -- data/objects-map-points.json 2>/dev/null || true
            exit 0
          fi
          git config user.name "abhazbereg-autosync"
          git config user.email "darya.tiande@gmail.com"
          git add data/objects-map-points.json
          git commit -m "Авто-синк точек карты из Яндекс-конструктора (GitHub Actions)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::Не удалось опубликовать обновление карты после 3 попыток."
          exit 1

      # Страховка снимков веб-камер: собственный крон webcams-snapshots.yml
      # GitHub задерживает на часы и порой доносит только ночью. Ежечасный
      # автосинк запускается стабильно, поэтому пробуем и отсюда — сам скрипт
      # работает лишь в дневное окно и не чаще раза в сутки, так что лишние
      # часы выходят мгновенно и без заливок.
      - name: Снимки веб-камер (страховка расписания)
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: pip install --quiet pyjwt cryptography && python3 tools/webcams_snapshots.py

      - name: Сохранить watch-state
        if: steps.gate.outputs.enabled == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: output/telegram-watch-state.json
          key: telegram-watch-state-${{ github.run_id }}

      - name: Уведомить в Telegram
        if: steps.gate.outputs.enabled == 'true' && steps.detect.outputs.changed == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_REPORT_CHAT_ID: ${{ secrets.TG_REPORT_CHAT_ID }}
          PUSHED: ${{ steps.publish.outputs.pushed }}
          FILES: ${{ steps.publish.outputs.files }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_REPORT_CHAT_ID" ]; then
            echo "TG_BOT_TOKEN/TG_REPORT_CHAT_ID не заданы — уведомление пропущено."
            exit 0
          fi
          REPORT=$(head -c 3000 output/telegram-watch-report.txt 2>/dev/null || true)
          if [ "$PUSHED" = "true" ]; then
            HEAD_MSG="✅ Автосинк: изменения из Telegram опубликованы на сайт (файлов: ${FILES})."
          elif [ "$SYNC_ENABLED" = "true" ]; then
            HEAD_MSG="ℹ️ Изменения в Telegram обработаны, публикация не потребовалась."
          else
            HEAD_MSG="🔭 Есть изменения в Telegram. Автосинк выключен (нет ключей Yandex) — нужен ручной синк."
          fi
          MSG=$(printf '%s\n\n%s' "$HEAD_MSG" "$REPORT")
          curl -sS "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_REPORT_CHAT_ID}" \
            --data-urlencode "text=${MSG}" >/dev/null
          echo "Уведомление отправлено."

      # Если проверка каналов упала (разлогинилась Telegram-сессия, Telegram не
      # ответил), шаг выше не срабатывает: он ждёт changed=true, а до него дело
      # не доходит. Тогда сайт молча перестаёт обновляться — так и случилось
      # 5–8 августа 2026, три дня без синка и без единого сигнала.
      # Бот шлёт через свой токен, а не через сессию, поэтому работает и тогда,
      # когда сессия умерла. Раз в 6 часов, чтобы не заваливать чат каждый час.
      - name: Сообщить о сбое проверки
        if: failure() && steps.gate.outputs.enabled == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_REPORT_CHAT_ID: ${{ secrets.TG_REPORT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_REPORT_CHAT_ID" ]; then
            echo "TG_BOT_TOKEN/TG_REPORT_CHAT_ID не заданы — уведомление о сбое пропущено."
            exit 0
          fi
          HOUR=$(date -u +%H)
          if [ $((10#$HOUR % 6)) -ne 0 ]; then
            echo "Час $HOUR UTC — не время для повторного сигнала, молчу."
            exit 0
          fi
          MSG=$(printf '%s\n\n%s\n\n%s' \
            "⛔️ Автосинк не работает: проверка каналов Telegram падает." \
            "Новые посты из каналов НЕ попадают на сайт. Чаще всего причина — Telegram-сессия разлогинилась, тогда нужно перевыпустить TG_STRING_SESSION (tools/make_tg_string_session.py на Mac)." \
            "Журнал: ${RUN_URL}")
          curl -sS "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_REPORT_CHAT_ID}" \
            --data-urlencode "text=${MSG}" >/dev/null
          echo "Уведомление о сбое отправлено."
