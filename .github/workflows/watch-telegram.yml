name: Watch Telegram

# Telethon (MTProto) фильтруется на RU-хостингах (Timeweb): подключение к DC
# обрывается на рукопожатии. Раннеры GitHub находятся вне РФ, поэтому проверка
# каналов выполняется здесь. Bot API-бот на VPS продолжает слать уведомления.
#
# Требуемые секреты (Settings → Secrets and variables → Actions):
#   TG_STRING_SESSION — из tools/make_tg_string_session.py (запуск на Mac)
#   TELEGRAM_API_ID / TELEGRAM_API_HASH — необязательно (есть значения по умолчанию)
#   TG_BOT_TOKEN / TG_REPORT_CHAT_ID — необязательно, для уведомлений об изменениях
# Пока TG_STRING_SESSION не задан, workflow завершается успешно с подсказкой.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *"

concurrency:
  group: watch-telegram
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
    steps:
      - name: Проверить наличие сессии
        id: gate
        run: |
          if [ -z "$TG_STRING_SESSION" ]; then
            echo "TG_STRING_SESSION не задан — пропускаю (см. deploy/TELEGRAM_CONNECTIVITY.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.11"

      - name: Установить Telethon
        if: steps.gate.outputs.enabled == 'true'
        run: pip install --quiet telethon

      - name: Восстановить watch-state
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: output/telegram-watch-state.json
          key: telegram-watch-state-${{ github.run_id }}
          restore-keys: |
            telegram-watch-state-

      - name: Проверить каналы (watch-telegram)
        if: steps.gate.outputs.enabled == 'true'
        run: python scripts/watch_telegram_updates.py --strict

      - name: Сохранить watch-state
        if: steps.gate.outputs.enabled == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: output/telegram-watch-state.json
          key: telegram-watch-state-${{ github.run_id }}

      - name: Уведомить об изменениях
        if: steps.gate.outputs.enabled == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_REPORT_CHAT_ID: ${{ secrets.TG_REPORT_CHAT_ID }}
        run: |
          TARGETS=output/telegram-watch-changed-targets.json
          if [ ! -s "$TARGETS" ] || [ "$(python -c "import json;d=json.load(open('$TARGETS'));print(len(d) if isinstance(d,list) else len(d.get('targets') or d))" 2>/dev/null || echo 0)" = "0" ]; then
            echo "Изменений нет — уведомление не требуется."
            exit 0
          fi
          echo "::notice::Обнаружены изменения в Telegram-каналах — нужен запуск синка."
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_REPORT_CHAT_ID" ]; then
            REPORT=$(head -c 3500 output/telegram-watch-report.txt 2>/dev/null || true)
            MSG=$(printf '🔭 watch-telegram (GitHub Actions): есть изменения.\n\n%s' "$REPORT")
            curl -sS "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_REPORT_CHAT_ID}" \
              --data-urlencode "text=${MSG}" >/dev/null
            echo "Уведомление отправлено в Telegram."
          else
            echo "TG_BOT_TOKEN/TG_REPORT_CHAT_ID не заданы — уведомление пропущено."
          fi
