name: Media audit

# Сплошная проверка всех фото и видео сайта на живом домене: код ответа, тип,
# размер и настоящее содержимое файла. Смоук каждые 6 часов проверяет только
# выборочные страницы и блоки «Дополнительные материалы», а здесь — всё.
# Раз в неделю и по кнопке.

on:
  workflow_dispatch:
  schedule:
    - cron: "40 3 * * 1"

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Проверить все медиа сайта
        run: python3 tools/check_site_media_prod.py --quiet | tee output-media-audit.txt

      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-audit
          path: output-media-audit.txt
          if-no-files-found: ignore
