name: Webcams snapshots

# Ежедневные снимки с веб-камер для страницы /veb-kamery-abhazii/:
# один кадр с каждой камеры реестра data/webcams.json → бакет media/webcams/.
# Разрешение владельцев камер на публикацию кадров получено (август 2026).
# Крон GitHub уплывает на часы (28–30.08.2026 запуски уезжали в ночь и
# заливали тёмные кадры), поэтому попыток несколько за день, а скрипт сам
# решает: работает только в дневное окно 07:00–14:00 UTC (10:00–17:00 МСК)
# и не чаще одного раза в сутки (разрешение владельцев — один кадр в день).
# Минуты не «:00» нарочно: круглые минуты GitHub пропускает чаще.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"
    - cron: "37 9 * * *"
    - cron: "51 11 * * *"

jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: |
          pip install --quiet boto3 pyjwt cryptography
          sudo apt-get -yq install ffmpeg >/dev/null 2>&1

      - name: Снять и залить снимки
        env:
          YANDEX_S3_ACCESS_KEY_ID: ${{ secrets.YANDEX_S3_ACCESS_KEY_ID }}
          YANDEX_S3_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_S3_SECRET_ACCESS_KEY }}
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: python3 tools/webcams_snapshots.py
