# Показывает, в какие группы добавлен бот сайта и какие у них номера (id).
# Нужен, когда надо вписать номер нового чата в секрет TG_REPORT_CHAT_ID.
#
# Печатает ТОЛЬКО названия групп/каналов и их id — ни текстов сообщений, ни
# имён людей, ни личных чатов (репозиторий публичный, журналы видны всем).
# Ничего не отправляет и не подтверждает очередь (getUpdates без offset).
#
# Ограничение: если бот сайта запущен на Mac (site_update_bot.py, долгий
# опрос), он сам забирает события из очереди — тогда здесь будет «событий
# нет». В этом случае остановить бота на Mac, снова добавить бота в группу
# (или написать в ней /start) и запустить ещё раз. Telegram хранит события
# не дольше 24 часов.
name: Telegram Chat IDs

on:
  workflow_dispatch:

permissions: {}

jobs:
  chat-ids:
    name: Show chat ids
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Read pending updates
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TG_BOT_TOKEN}" ]; then
            echo "Не задан секрет TG_BOT_TOKEN"
            exit 1
          fi
          curl -sS --max-time 30 "https://api.telegram.org/bot${TG_BOT_TOKEN}/getMe" > me.json
          curl -sS --max-time 60 "https://api.telegram.org/bot${TG_BOT_TOKEN}/getUpdates?limit=100" > updates.json

          python3 - <<'PY'
          import json
          me = json.load(open("me.json"))
          if not me.get("ok"):
              print("getMe не ok:", me.get("description"))
              raise SystemExit(1)
          print(f"Бот: @{me['result'].get('username')}")
          body = json.load(open("updates.json"))
          if not body.get("ok"):
              print("Telegram ответил ошибкой:", body.get("description"))
              raise SystemExit(1)
          chats = {}
          for update in body["result"]:
              for key in ("message", "edited_message", "channel_post", "my_chat_member", "chat_member"):
                  obj = update.get(key)
                  chat = obj and obj.get("chat")
                  if chat and chat.get("type") in ("group", "supergroup", "channel"):
                      chats[chat["id"]] = f"{chat.get('title') or ''} ({chat['type']})"
          if not chats:
              print("В очереди нет событий по группам. Возможно, их уже забрал бот на Mac —")
              print("остановить его, снова добавить бота в группу или написать там /start, запустить ещё раз.")
              raise SystemExit(0)
          print("Группы, где бот видел события:")
          for chat_id, title in chats.items():
              print(f"  {chat_id}  —  {title}")
          PY
