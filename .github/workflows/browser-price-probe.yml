name: Browser price probe

# Съём цен со страниц отелей настоящим браузером: раскрывает кнопки «Показать
# цены» и собирает помесячный прайс там, где обычный запрос видит пустоту.
# Ничего не публикует: результат — лог + артефакт (JSON и скриншоты).

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Ссылки для проверки (по одной в строке)"
        required: true
      checkin:
        description: "Дата заезда ГГГГ-ММ-ДД (для площадок с календарём)"
        required: false
        default: "2026-08-25"
      checkout:
        description: "Дата выезда ГГГГ-ММ-ДД"
        required: false
        default: "2026-08-30"
      guests:
        description: "Гостей"
        required: false
        default: "2"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить Playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Снять цены браузером
        env:
          PROBE_URLS: ${{ inputs.urls }}
          PROBE_CHECKIN: ${{ inputs.checkin }}
          PROBE_CHECKOUT: ${{ inputs.checkout }}
          PROBE_GUESTS: ${{ inputs.guests }}
        run: python tools/browser_price_probe.py

      - name: Выгрузить результаты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-probe
          path: output/browser-probe/
          if-no-files-found: ignore

      # Повтор сводки последним шагом: в хвосте лога сразу видны снятые цены,
      # не приходится перематывать вывод установки браузера и выгрузки артефакта.
      - name: Сводка по ценам
        if: always()
        run: cat output/browser-probe/summary.txt || true
