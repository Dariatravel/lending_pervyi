name: Deploy to Yandex

# Держит бакет abhazbereg-site в том же состоянии, что и GitHub Pages.
# Пока домен указывает на GitHub, это запасная площадка; после переключения
# DNS она станет основной, и отставать ей нельзя ни на час.
#
# Автосинк каталога пушит в main каждый час, когда в Telegram что-то менялось,
# — заливка идёт следом и занимает около минуты.

on:
  push:
    branches: [main]
    # tools/ намеренно НЕ игнорируем: правила заливки лежат в
    # tools/deploy_site_to_yandex.py, и когда меняются они, бакет тоже должен
    # перезалиться. Иначе правка «добавить в заливку файлы подтверждения прав»
    # остаётся на бумаге — так и случилось 8 августа.
    paths-ignore:
      - "docs/**"
      - "deploy/**"
      - "scripts/**"
      - "**/*.md"
  # Пуши автосинка сделаны из-под стандартного GITHUB_TOKEN, а такие пуши
  # GitHub нарочно не считает событием push для других воркфлоу (защита от
  # зацикливания). Без этого триггера ежечасные обновления каталога и карты
  # оставались бы только на GitHub Pages и не доезжали до бакета — так
  # 11 августа новый объект сутки отдавал 404 с основного домена.
  workflow_run:
    workflows: ["Watch Telegram", "Blog Sync"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Если пуши идут подряд, промежуточные заливки не нужны: важно только то,
# что в main сейчас. Начатую не прерываем, чтобы бакет не остался наполовину.
concurrency:
  group: deploy-to-yandex
  cancel-in-progress: false

jobs:
  deploy:
    # После Watch Telegram заливаем только удачные прогоны: упавший синк
    # мог оставить в main вчерашнее состояние, его перезаливать незачем.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENDPOINT: https://storage.yandexcloud.net
      AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ru-central1
    steps:
      # Всегда берём свежую вершину main: заливать важно то, что в main
      # сейчас, а не тот коммит, на котором родилось событие (для
      # workflow_run это был бы коммит ДО пуша автосинка).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Проверить ключи
        id: gate
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "Ключей YANDEX_S3_* нет — пропускаю заливку."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Установить boto3
        if: steps.gate.outputs.enabled == 'true'
        run: pip install --quiet boto3

      - name: Залить сайт в бакет
        if: steps.gate.outputs.enabled == 'true'
        run: python3 tools/deploy_site_to_yandex.py --bucket abhazbereg-site

      # Молчим, когда всё хорошо: успешная заливка идёт много раз в сутки.
      # Сообщаем только о поломке — иначе о ней узнаем в тот день, когда
      # домен уже будет переключён на бакет.
      - name: Сообщить о сбое заливки
        if: failure() && steps.gate.outputs.enabled == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_REPORT_CHAT_ID: ${{ secrets.TG_REPORT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_REPORT_CHAT_ID" ]; then exit 0; fi
          MSG=$(printf '%s\n\n%s' \
            "⛔️ Не удалось залить сайт в Яндекс Облако. Копия в бакете отстала от сайта." \
            "Журнал: ${RUN_URL}")
          curl -sS "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_REPORT_CHAT_ID}" \
            --data-urlencode "text=${MSG}" >/dev/null
