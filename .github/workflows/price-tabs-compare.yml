name: Price tabs compare

# Ежечасная сверка вкладок «ЦЕНЫ АВТО» (из Telegram) и «АКТУАЛЬНЫЕ ЦЕНЫ»
# (ручная) в Google-таблице «СЕЗОН 2026» — по образцу watch-telegram.yml:
# запускается каждый час, но пишет в Telegram только когда результат сверки
# изменился с прошлого запуска (состояние хранится в actions/cache).

on:
  workflow_dispatch:
  schedule:
    - cron: "10 * * * *" # каждый час в :10 (watch-telegram ходит в :41)

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # нужно для сохранения кэша состояния
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet google-auth google-api-python-client

      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: output/price-tabs-compare-state.txt
          key: price-tabs-compare-state-${{ vars.TG_PRICE_REPORT_CHAT_ID }}-${{ github.run_id }}
          restore-keys: |
            price-tabs-compare-state-${{ vars.TG_PRICE_REPORT_CHAT_ID }}-

      - name: Run price tabs compare
        env:
          GOOGLE_SA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SA" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON не задан — сверка невозможна."
            exit 1
          fi
          printf '%s' "$GOOGLE_SA" > google-service-account.json
          python3 tools/compare_price_tabs.py --write-sheet

      - name: Detect changes
        id: detect
        run: |
          REPORT="output/price_tabs_compare_report.txt"
          STATE="output/price-tabs-compare-state.txt"
          # отпечаток отчёта без строки с датой запуска
          HASH=$(grep -v '^Дата запуска:' "$REPORT" | sha256sum | cut -d' ' -f1)
          PREV=$(cat "$STATE" 2>/dev/null || echo "none")
          echo "Отпечаток: $HASH (предыдущий: $PREV)"
          if [ "$HASH" = "$PREV" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Результат сверки не изменился — уведомление не нужно."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          printf '%s' "$HASH" > "$STATE"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: price-tabs-compare
          path: output/price_tabs_compare_report.txt
          if-no-files-found: ignore

      # Только эта сверка идёт в «Абхазберег · Реклама».
      # Общий secrets.TG_REPORT_CHAT_ID остаётся у остальных отчётов.
      - name: Verify price report destination
        id: telegram_destination
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_REPORT_CHAT_ID: ${{ vars.TG_PRICE_REPORT_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_REPORT_CHAT_ID" ]; then
            echo "TG_BOT_TOKEN/TG_PRICE_REPORT_CHAT_ID не заданы. Запасного получателя нет."
            exit 1
          fi
          ME=$(curl --fail-with-body -sS --max-time 30 "https://api.telegram.org/bot${TG_BOT_TOKEN}/getMe")
          printf '%s' "$ME" | jq -e '.ok == true and .result.username == "abhazbereg_checkbot"' >/dev/null
          BOT_ID=$(printf '%s' "$ME" | jq -er '.result.id')
          CHAT=$(curl --fail-with-body -sS --max-time 30 "https://api.telegram.org/bot${TG_BOT_TOKEN}/getChat" \
            --data-urlencode "chat_id=${TG_REPORT_CHAT_ID}")
          printf '%s' "$CHAT" | jq -e --argjson chat "$TG_REPORT_CHAT_ID" \
            '.ok == true and .result.id == $chat and (.result.type == "group" or .result.type == "supergroup") and (.result.title | test("^Абхазберег[[:space:]·—–-]+Реклама$"; "i"))' >/dev/null
          MEMBER=$(curl --fail-with-body -sS --max-time 30 "https://api.telegram.org/bot${TG_BOT_TOKEN}/getChatMember" \
            --data-urlencode "chat_id=${TG_REPORT_CHAT_ID}" --data-urlencode "user_id=${BOT_ID}")
          printf '%s' "$MEMBER" | jq -e '.ok == true and (.result.status == "administrator" or .result.status == "creator")' >/dev/null
          echo "Проверены @abhazbereg_checkbot и рекламная группа ${TG_REPORT_CHAT_ID}."

      - name: Notify Telegram
        if: steps.detect.outputs.changed == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_REPORT_CHAT_ID: ${{ vars.TG_PRICE_REPORT_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_REPORT_CHAT_ID" ]; then
            echo "TG_BOT_TOKEN/TG_PRICE_REPORT_CHAT_ID не заданы."
            exit 1
          fi
          REPORT="output/price_tabs_compare_report.txt"
          SUMMARY=$(sed -n '1,12p' "$REPORT")
          DIFFS=$(awk '/^РАСХОЖДЕНИЯ ЦЕН$/{f=1; next} f && /^ЕСТЬ НА САЙТЕ|^ОБЪЕКТ НЕ НАЙДЕН|^ОБЪЕКТ НАЙДЕН/{exit} f && !/^=+$/' "$REPORT" | head -c 2300)
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$DIFFS" ]; then
            MSG=$(printf '📊 Сверка цен (ручная vs авто): результат изменился\n\n%s\n\nРасхождения (начало списка):%s\n\n(обрезано; полный отчёт — в артефактах запуска)\n%s' "$SUMMARY" "$DIFFS" "$RUN_URL")
          else
            MSG=$(printf '📊 Сверка цен (ручная vs авто): результат изменился\n\n%s\n\nРасхождений цен нет ✅\n%s' "$SUMMARY" "$RUN_URL")
          fi
          printf '%s' "$MSG" | head -c 3900 > msg.txt
          RESULT=$(curl --fail-with-body -sS --max-time 30 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_REPORT_CHAT_ID}" \
            --data-urlencode "text@msg.txt")
          printf '%s' "$RESULT" | jq -e --argjson chat "$TG_REPORT_CHAT_ID" '.ok == true and .result.chat.id == $chat' >/dev/null
          printf '%s' "$RESULT" | jq -c '{sent: .ok, chat_id: .result.chat.id, message_id: .result.message_id}'

      # Сохраняем отпечаток только после успешной доставки (или если изменений нет).
      - name: Save state
        uses: actions/cache/save@v4
        with:
          path: output/price-tabs-compare-state.txt
          key: price-tabs-compare-state-${{ vars.TG_PRICE_REPORT_CHAT_ID }}-${{ github.run_id }}

      # Не чаще раза в 6 часов, чтобы при поломке не заваливать чат каждый час
      # (тот же приём, что в watch-telegram.yml).
      - name: Notify Telegram on failure
        if: failure() && steps.telegram_destination.outcome == 'success'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_REPORT_CHAT_ID: ${{ vars.TG_PRICE_REPORT_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_REPORT_CHAT_ID" ]; then
            exit 0
          fi
          HOUR=$(date -u +%H)
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ $((10#$HOUR % 6)) -ne 0 ]; then
            echo "Час $HOUR UTC — не время для повторного сигнала, молчу."
            exit 0
          fi
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          RESULT=$(curl --fail-with-body -sS --max-time 30 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_REPORT_CHAT_ID}" \
            --data-urlencode "text=⚠️ Сверка цен (ручная vs авто) упала. Подробности: ${RUN_URL}")
          printf '%s' "$RESULT" | jq -e --argjson chat "$TG_REPORT_CHAT_ID" '.ok == true and .result.chat.id == $chat' >/dev/null

      # Та же тревога — дежурному агенту на Mac mini (см. .github/actions/incident).
      # Повторы дежурный отсеивает сам по ключу, поэтому без оглядки на часы.
      - name: Передать инцидент дежурному
        if: failure()
        uses: ./.github/actions/incident
        with:
          source: сайт
          text: "Сверка цен (ручная vs авто) упала. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          key: сайт-сверка-цен
          url: ${{ secrets.INCIDENT_WEBHOOK_URL }}
          secret: ${{ secrets.INCIDENT_WEBHOOK_SECRET }}
