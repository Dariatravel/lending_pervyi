name: Post-deploy smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check production pages
        run: python tools/post_deploy_smoke.py

      # Отдельно следим за страницами, которые Вебмастер показывает в топе:
      # код ответа, скорость, title, canonical, запрет индексации.
      - name: Check key pages from Yandex Webmaster
        run: python tools/webmaster_recommended_pages_check.py --strict

      # Фото и видео из комментариев («Дополнительные материалы») заливаются
      # отдельно от галереи объекта, поэтому битая ссылка тут заметна только
      # гостю. Проверяем их каждым прогоном смоука.
      - name: Check supplemental media
        run: python tools/check_supplemental_media_prod.py

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webmaster-pages-health
          path: output/webmaster_pages_health.txt
          if-no-files-found: ignore

      # До 05.09.2026 смоук падал молча: истёкший сертификат медиа-домена
      # заметили гости, а не мониторинг. Теперь любое падение — сигнал в чат.
      - name: Сообщить о падении в Telegram
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_REPORT_CHAT_ID: ${{ secrets.TG_REPORT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_REPORT_CHAT_ID" ]; then
            echo "TG_BOT_TOKEN/TG_REPORT_CHAT_ID не заданы — уведомление пропущено."
            exit 0
          fi
          MSG=$(printf '🚨 Проверка прода (smoke) упала — сайт может отдавать гостям ошибки.\n\nПодробности: %s' "$RUN_URL")
          curl -sS "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_REPORT_CHAT_ID}" \
            --data-urlencode "text=${MSG}" >/dev/null
          echo "Уведомление отправлено."
