name: Yandex site hosting

# Переезд сайта с GitHub Pages в Yandex Object Storage.
# Из песочницы агента облако недоступно (сеть закрыта политикой), а здесь
# открыто — и ключи YANDEX_S3_* уже есть в Secrets: ими автосинк заливает медиа.
# Поэтому переезд ведём отсюда, по шагам, каждый запускается вручную.
#
#   probe   — что умеют текущие ключи: видят ли бакеты, хватает ли прав на создание
#   create  — создать бакет сайта и включить режим статического хостинга
#   deploy  — залить готовый сайт в бакет (без медиа и исходников)
#   verify  — проверить, что по адресу бакета отдаётся живой сайт
#
# Домен не трогается ни на одном шаге: переключение DNS — отдельное решение
# владелицы, до него сайт живёт на GitHub Pages как и раньше.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Шаг: probe / create / deploy / verify / cert-request / cert-status / cdn-grant / cdn-probe / cdn-create / cdn-status / dns-snapshot / domain-check / redirect-create / cert-request-com / cert-status-com / cdn-create-com / cdn-status-com"
        required: true
        default: "probe"
      bucket:
        description: "Имя бакета для сайта"
        required: false
        default: "abhazbereg-site"

env:
  ENDPOINT: https://storage.yandexcloud.net
  AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_S3_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ru-central1
  BUCKET: ${{ inputs.bucket }}

jobs:
  hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить boto3
        if: inputs.action == 'deploy' || inputs.action == 'verify'
        run: pip install --quiet boto3

      - name: Проверить, что ключи заданы
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "Нет секретов YANDEX_S3_ACCESS_KEY_ID / YANDEX_S3_SECRET_ACCESS_KEY."
            exit 1
          fi
          echo "Ключи на месте (значения не печатаем)."

      # Разведка: понять, что можно сделать этими ключами, ничего не меняя.
      - name: probe — что умеют ключи
        if: inputs.action == 'probe'
        run: |
          echo "=== Бакеты, которые видит ключ ==="
          aws s3 ls --endpoint-url "$ENDPOINT" || echo "Список бакетов недоступен (роль уже, чем storage.admin)."

          echo
          echo "=== Чтение бакета медиа (должно работать — им пользуется автосинк) ==="
          aws s3 ls s3://abhazbereg-media/media/ --endpoint-url "$ENDPOINT" | head -5 \
            || echo "ВНИМАНИЕ: даже медиа не читается, ключ не тот."

          echo
          echo "=== Существует ли уже бакет сайта «$BUCKET» ==="
          if aws s3 ls "s3://$BUCKET" --endpoint-url "$ENDPOINT" >/dev/null 2>&1; then
            echo "Бакет уже есть — шаг create не нужен."
          else
            echo "Бакета нет. Проверяю право на создание пробным бакетом..."
            PROBE="abhazbereg-probe-$(date +%s)"
            if aws s3 mb "s3://$PROBE" --endpoint-url "$ENDPOINT" 2>&1; then
              echo "ПРАВА НА СОЗДАНИЕ ЕСТЬ. Убираю пробный бакет."
              aws s3 rb "s3://$PROBE" --endpoint-url "$ENDPOINT"
            else
              echo "ПРАВ НА СОЗДАНИЕ НЕТ — бакет должна создать владелица в консоли."
            fi
          fi

      - name: create — бакет и режим статического сайта
        if: inputs.action == 'create'
        run: |
          if aws s3 ls "s3://$BUCKET" --endpoint-url "$ENDPOINT" >/dev/null 2>&1; then
            echo "Бакет «$BUCKET» уже существует — создавать нечего."
          else
            aws s3 mb "s3://$BUCKET" --endpoint-url "$ENDPOINT"
            echo "Бакет «$BUCKET» создан."
          fi
          # Публичное чтение объектов: сайт должен открываться всем.
          # Право на запись остаётся только у ключа, он в Secrets.
          aws s3api put-bucket-acl --bucket "$BUCKET" --acl public-read \
            --endpoint-url "$ENDPOINT" && echo "Публичное чтение включено."
          aws s3 website "s3://$BUCKET" --index-document index.html \
            --error-document 404.html --endpoint-url "$ENDPOINT" \
            && echo "Режим статического сайта включён: index.html + 404.html."

      - name: deploy — залить сайт в бакет
        if: inputs.action == 'deploy'
        run: python3 tools/deploy_site_to_yandex.py --bucket "$BUCKET"

      - name: verify — проверить сайт по адресу бакета
        if: inputs.action == 'verify'
        run: python3 tools/deploy_site_to_yandex.py --bucket "$BUCKET" --verify-only

      # Сертификаты — отдельная служба облака, ключи от хранилища к ней не подходят.
      # Нужен авторизованный ключ сервисного аккаунта в секрете YC_SA_KEY_JSON.
      - name: Установить PyJWT
        if: startsWith(inputs.action, 'cert-')
        run: pip install --quiet pyjwt cryptography

      - name: cert-request — заказать сертификат на домен
        if: inputs.action == 'cert-request'
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: python3 tools/yc_certificate.py request

      - name: cert-status — что с сертификатом и чего он ждёт
        if: inputs.action == 'cert-status'
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: python3 tools/yc_certificate.py status

      # CDN — единственное место, куда прикрепляется наш сертификат: бакет
      # отдаёт свой домен только по HTTP. Домен на CDN не переключается.
      - name: Установить PyJWT (CDN)
        if: startsWith(inputs.action, 'cdn-')
        run: pip install --quiet pyjwt cryptography

      - name: cdn-grant — попробовать выдать роль cdn.editor
        if: inputs.action == 'cdn-grant'
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: python3 tools/yc_cdn.py grant

      - name: cdn-probe — хватает ли прав и что уже создано
        if: inputs.action == 'cdn-probe'
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          SITE_BUCKET: ${{ inputs.bucket }}
        run: python3 tools/yc_cdn.py probe

      - name: cdn-create — создать ресурс CDN с сертификатом
        if: inputs.action == 'cdn-create'
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          SITE_BUCKET: ${{ inputs.bucket }}
        run: python3 tools/yc_cdn.py create

      # Только чтение: список записей зоны до переноса и для сверки после.
      - name: dns-snapshot — что сейчас в зоне домена
        if: inputs.action == 'dns-snapshot'
        run: python3 tools/dns_zone_snapshot.py

      # ===== Редиректор abhazbereg.com: «будочка» переезжает в Россию =====
      # Старая будочка на GitHub Pages переадресует только главную, а глубокие
      # ссылки /hotels/... отдают голый 404 (найдено Codex 10.08.2026). Новая —
      # пустой бакет, чья website-настройка отвечает 301 на абхазберег.рф с
      # сохранением пути. DNS домена не трогается ни одним из шагов.
      - name: redirect-create — бакет-будочка с 301 на основной домен
        if: inputs.action == 'redirect-create'
        run: |
          RB="abhazbereg-com-redirect"
          echo "=== Сначала: жив ли резерв GitHub Pages (проверка отчёта Codex) ==="
          # dariatravel.github.io отдаёт 404 закономерно: репозиторий настроен
          # на кастомный домен. Резерв проверяется запросом с именем сайта
          # напрямую к адресам GitHub.
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 \
            --resolve "xn--80aacbklan7f0b.xn--p1ai:443:185.199.108.153" \
            "https://xn--80aacbklan7f0b.xn--p1ai/" || echo 000)
          echo "GitHub Pages по прямому адресу с нашим именем: HTTP $CODE"

          echo
          echo "=== Бакет-будочка ==="
          if aws s3 ls "s3://$RB" --endpoint-url "$ENDPOINT" >/dev/null 2>&1; then
            echo "Бакет $RB уже есть."
          else
            aws s3 mb "s3://$RB" --endpoint-url "$ENDPOINT" && echo "Бакет $RB создан."
          fi
          aws s3api put-bucket-acl --bucket "$RB" --acl public-read --endpoint-url "$ENDPOINT"
          aws s3api put-bucket-website --bucket "$RB" --endpoint-url "$ENDPOINT" \
            --website-configuration '{"RedirectAllRequestsTo":{"HostName":"xn--80aacbklan7f0b.xn--p1ai","Protocol":"https"}}'
          echo "Website-настройка: все запросы → 301 на основной домен."

          echo
          echo "=== Проверка 301 с сохранением пути ==="
          sleep 5
          for P in "/" "/hotels/lazurit-novyy-otel-s-zavtrakami-2583/" "/kvartira/akira-2k-kvartira-1623/?x=1"; do
            R=$(curl -sS -o /dev/null -w "%{http_code} -> %{redirect_url}" --max-time 20 \
              "http://$RB.website.yandexcloud.net$P" || echo "ошибка")
            echo "  $P"
            echo "     $R"
          done

      - name: cert-request-com — сертификат для abhazbereg.com
        if: inputs.action == 'cert-request-com'
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          CERT_NAME: abhazbereg-com
          CERT_DOMAIN: abhazbereg.com
        run: pip install --quiet pyjwt cryptography && python3 tools/yc_certificate.py request

      - name: cert-status-com — что с сертификатом abhazbereg.com
        if: inputs.action == 'cert-status-com'
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          CERT_NAME: abhazbereg-com
          CERT_DOMAIN: abhazbereg.com
        run: pip install --quiet pyjwt cryptography && python3 tools/yc_certificate.py status

      - name: cdn-create-com — CDN-ресурс редиректора
        if: inputs.action == 'cdn-create-com'
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          CDN_DOMAIN: abhazbereg.com
          CDN_CERT_NAME: abhazbereg-com
          CDN_GROUP_NAME: abhazbereg-com-origin
          CDN_ORIGIN_HOST: abhazbereg-com-redirect.website.yandexcloud.net
        run: pip install --quiet pyjwt cryptography && python3 tools/yc_cdn.py create

      - name: cdn-status-com — состояние CDN редиректора
        if: inputs.action == 'cdn-status-com'
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          CDN_DOMAIN: abhazbereg.com
          CDN_CERT_NAME: abhazbereg-com
          CDN_GROUP_NAME: abhazbereg-com-origin
          CDN_ORIGIN_HOST: abhazbereg-com-redirect.website.yandexcloud.net
        run: pip install --quiet pyjwt cryptography && python3 tools/yc_cdn.py status

      # Проверка живого домена после переключения DNS: то, чего не покрывают
      # smoke (он не смотрит файлы верификации) и availability (только корень).
      - name: domain-check — домен после переключения
        if: inputs.action == 'domain-check'
        run: |
          BASE="https://xn--80aacbklan7f0b.xn--p1ai"
          FAIL=0
          # Порог размера маленький: файл подтверждения Google — это одна
          # строка, 54 байта, и это его нормальный вид.
          check() {
            CODE=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 30 "$1" 2>/dev/null || echo 000)
            SIZE=$(wc -c < /tmp/body 2>/dev/null || echo 0)
            if [ "$CODE" = "200" ] && [ "$SIZE" -gt 20 ]; then
              echo "OK    $1 (код $CODE, $SIZE байт)"
            else
              echo "ПЛОХО $1 (код $CODE, $SIZE байт)"; FAIL=1
            fi
          }
          check "$BASE/"
          check "$BASE/yandex_983ef30d774036c7.html"
          check "$BASE/googlec85b3e07af80e239.html"
          check "$BASE/styles.min.css"
          check "$BASE/karta/"
          check "$BASE/data/catalog-index.json"
          check "https://www.xn--80aacbklan7f0b.xn--p1ai/"
          echo
          echo "=== кто отдаёт сайт (заголовок Server) ==="
          curl -sSI --max-time 30 "$BASE/" | grep -iE "^(server|via):" || true
          exit $FAIL

      - name: cdn-status — состояние ресурса
        if: inputs.action == 'cdn-status'
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          SITE_BUCKET: ${{ inputs.bucket }}
        run: python3 tools/yc_cdn.py status
