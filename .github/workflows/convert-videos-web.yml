name: Convert videos to web

# Ручная конвертация видео-исходников бакета в лёгкие web-варианты
# (960px / H.264 1200k). Исходники не удаляются, ссылки на страницах
# не меняются — это отдельные шаги. Запускать батчами: limit=60 за раз
# (169 исходников ≈ 3 запуска).

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Сколько видео обработать за прогон"
        required: false
        default: "60"

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: |
          pip install --quiet boto3
          sudo apt-get -yq install ffmpeg >/dev/null 2>&1

      - name: Конвертировать и залить web-варианты
        env:
          YANDEX_S3_ACCESS_KEY_ID: ${{ secrets.YANDEX_S3_ACCESS_KEY_ID }}
          YANDEX_S3_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_S3_SECRET_ACCESS_KEY }}
        run: python tools/convert_source_videos_to_web.py --limit "${{ inputs.limit }}"
